<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Traffic from DNS to the pod">
  <rect width="1100" height="620" fill="#0f1720"/>
  <text x="36" y="42" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Traffic from DNS to the pod</text>
  <text x="36" y="68" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">ShopSphere. Two Availability Zones in every environment. Pre-prod and prod also replicate Aurora to us-west-1.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="36" y="100" width="140" height="64" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="106" y="128" text-anchor="middle">Browser</text>
    <text x="106" y="146" text-anchor="middle" fill="#94a3b8" font-size="11">shopper</text>
    <rect x="210" y="100" width="160" height="64" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="290" y="128" text-anchor="middle">Route 53</text>
    <text x="290" y="146" text-anchor="middle" fill="#94a3b8" font-size="11">shop.env.infralabx.space</text>
    <rect x="404" y="100" width="170" height="64" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="489" y="128" text-anchor="middle">CloudFront + WAF</text>
    <text x="489" y="146" text-anchor="middle" fill="#94a3b8" font-size="11">HTTPS redirect</text>
    <rect x="608" y="48" width="170" height="64" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="693" y="76" text-anchor="middle">Private S3</text>
    <text x="693" y="94" text-anchor="middle" fill="#94a3b8" font-size="11">/images/* only</text>
    <rect x="608" y="152" width="170" height="64" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="693" y="180" text-anchor="middle">ALB + regional WAF</text>
    <text x="693" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">origin.env</text>
    <rect x="812" y="152" width="250" height="64" rx="10" fill="#1e293b" stroke="#a78bfa"/>
    <text x="937" y="178" text-anchor="middle">EKS Ingress</text>
    <text x="937" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">api-gateway to service pods</text>
    <rect x="210" y="280" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="310" y="308" text-anchor="middle">product user order payment</text>
    <text x="310" y="328" text-anchor="middle" fill="#94a3b8" font-size="11">migration job, then the pods</text>
    <rect x="440" y="280" width="150" height="70" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="515" y="308" text-anchor="middle">RDS Proxy</text>
    <text x="515" y="328" text-anchor="middle" fill="#94a3b8" font-size="11">TLS required</text>
    <rect x="620" y="280" width="180" height="70" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="710" y="308" text-anchor="middle">Aurora PostgreSQL</text>
    <text x="710" y="328" text-anchor="middle" fill="#94a3b8" font-size="11">writer + reader, two AZs</text>
    <rect x="830" y="280" width="150" height="70" rx="10" fill="#1e293b" stroke="#f97316"/>
    <text x="905" y="308" text-anchor="middle">us-west-1 reader</text>
    <text x="905" y="328" text-anchor="middle" fill="#94a3b8" font-size="11">pre-prod and prod</text>
    <rect x="210" y="400" width="170" height="64" rx="10" fill="#1e293b" stroke="#e11d48"/>
    <text x="295" y="428" text-anchor="middle">ElastiCache</text>
    <text x="295" y="446" text-anchor="middle" fill="#94a3b8" font-size="11">cart, Multi-AZ</text>
    <rect x="410" y="400" width="170" height="64" rx="10" fill="#1e293b" stroke="#e11d48"/>
    <text x="495" y="428" text-anchor="middle">Amazon MQ</text>
    <text x="495" y="446" text-anchor="middle" fill="#94a3b8" font-size="11">queues, console via tunnel</text>
    <rect x="610" y="400" width="220" height="64" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="720" y="428" text-anchor="middle">Secrets Manager + KMS</text>
    <text x="720" y="446" text-anchor="middle" fill="#94a3b8" font-size="11">one secret per service per env</text>
  </g>
  <g stroke="#64748b" fill="none" stroke-width="1.5">
    <path d="M176 132 H210" marker-end="url(#a)"/>
    <path d="M370 132 H404" marker-end="url(#a)"/>
    <path d="M574 116 L608 80" marker-end="url(#a)"/>
    <path d="M574 148 L608 184" marker-end="url(#a)"/>
    <path d="M778 184 H812" marker-end="url(#a)"/>
    <path d="M860 216 V280" marker-end="url(#a)"/>
    <path d="M410 315 H440" marker-end="url(#a)"/>
    <path d="M590 315 H620" marker-end="url(#a)"/>
    <path d="M800 315 H830" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
