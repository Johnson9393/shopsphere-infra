<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Traffic from DNS to the service">
  <rect width="1100" height="640" fill="#0f1720"/>
  <text x="36" y="40" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Traffic from DNS to the service</text>
  <text x="36" y="64" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">ShopSphere. /api goes through Amazon API Gateway. Pages go to the ALB. Pre-prod and prod also replicate Aurora and MSK to us-west-1.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="36" y="92" width="140" height="58" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="106" y="118" text-anchor="middle">Browser</text>
    <text x="106" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">shop.env.infralabx.space</text>
    <rect x="214" y="92" width="150" height="58" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="289" y="118" text-anchor="middle">Route 53</text>
    <text x="289" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">alias to CloudFront</text>
    <rect x="402" y="92" width="180" height="58" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="492" y="118" text-anchor="middle">CloudFront + WAF</text>
    <text x="492" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">HTTPS, API not cached</text>

    <rect x="640" y="36" width="180" height="52" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="730" y="58" text-anchor="middle">Private S3</text>
    <text x="730" y="74" text-anchor="middle" fill="#94a3b8" font-size="11">/images/*</text>
    <rect x="640" y="100" width="200" height="58" rx="10" fill="#1e293b" stroke="#a78bfa"/>
    <text x="740" y="124" text-anchor="middle">Amazon API Gateway</text>
    <text x="740" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">Cognito JWT, path rewrite</text>
    <rect x="860" y="176" width="200" height="58" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="960" y="200" text-anchor="middle">ALB + regional WAF</text>
    <text x="960" y="218" text-anchor="middle" fill="#94a3b8" font-size="11">origin.env, VPC link</text>

    <rect x="640" y="268" width="420" height="58" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="850" y="292" text-anchor="middle">Ingress on the shared load balancer</text>
    <text x="850" y="310" text-anchor="middle" fill="#94a3b8" font-size="11">/api/v1 to each Spring Boot service, / to React</text>

    <rect x="36" y="360" width="150" height="64" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="111" y="386" text-anchor="middle">product user</text>
    <text x="111" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">order payment</text>
    <rect x="206" y="360" width="130" height="64" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="271" y="386" text-anchor="middle">RDS Proxy</text>
    <text x="271" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">TLS</text>
    <rect x="356" y="360" width="170" height="64" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="441" y="386" text-anchor="middle">Aurora PostgreSQL</text>
    <text x="441" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">writer + reader</text>
    <rect x="546" y="360" width="160" height="64" rx="10" fill="#1e293b" stroke="#f97316"/>
    <text x="626" y="386" text-anchor="middle">us-west-1 reader</text>
    <text x="626" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">pre-prod and prod</text>

    <rect x="36" y="460" width="160" height="58" rx="10" fill="#1e293b" stroke="#e11d48"/>
    <text x="116" y="484" text-anchor="middle">ElastiCache</text>
    <text x="116" y="502" text-anchor="middle" fill="#94a3b8" font-size="11">cart, IAM token</text>
    <rect x="214" y="460" width="180" height="58" rx="10" fill="#1e293b" stroke="#e11d48"/>
    <text x="304" y="484" text-anchor="middle">MSK + Glue</text>
    <text x="304" y="502" text-anchor="middle" fill="#94a3b8" font-size="11">Avro, IAM, AKHQ local</text>
    <rect x="412" y="460" width="160" height="58" rx="10" fill="#1e293b" stroke="#a78bfa"/>
    <text x="492" y="484" text-anchor="middle">Cognito</text>
    <text x="492" y="502" text-anchor="middle" fill="#94a3b8" font-size="11">user pool per env</text>
    <rect x="590" y="460" width="230" height="58" rx="10" fill="#1e293b" stroke="#f59e0b"/>
    <text x="705" y="484" text-anchor="middle">CloudWatch + Grafana</text>
    <text x="705" y="502" text-anchor="middle" fill="#94a3b8" font-size="11">trace id, Fluent Bit, ADOT</text>
  </g>
  <g stroke="#64748b" fill="none" stroke-width="1.5">
    <path d="M176 121 H214" marker-end="url(#a)"/>
    <path d="M364 121 H402" marker-end="url(#a)"/>
    <path d="M582 108 L640 62" marker-end="url(#a)"/>
    <path d="M582 128 L640 124" marker-end="url(#a)"/>
    <path d="M560 150 L860 176" marker-end="url(#a)"/>
    <path d="M840 158 H860" marker-end="url(#a)"/>
    <path d="M960 234 V268" marker-end="url(#a)"/>
    <path d="M740 326 V360" marker-end="url(#a)"/>
    <path d="M186 392 H206" marker-end="url(#a)"/>
    <path d="M336 392 H356" marker-end="url(#a)"/>
    <path d="M526 392 H546" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="36" y="560" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Public reads: GET /api/products, POST /api/users/register, POST /api/users/login. Every other /api route requires the Cognito token.</text>
  <text x="36" y="582" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">API Gateway rewrites /api/products to /api/v1/products, and the same way for users, cart, orders, payments, and notifications.</text>
  <text x="36" y="612" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">AKHQ and the database tunnel are port-forwards. They are not public hostnames. There is no jump host.</text>
</svg>
