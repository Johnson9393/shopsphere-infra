<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#f7f4ec"/>
  <text x="36" y="42" font-family="Georgia, serif" font-size="28" fill="#1f2a24">ShopSphere platform</text>
  <text x="36" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4d5b53">High availability in two Availability Zones. Prod keeps a pilot-light copy in us-west-1.</text>

  <rect x="24" y="92" width="1232" height="150" rx="12" fill="#fff" stroke="#1f2a24"/>
  <text x="40" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2a24">Edge, both accounts</text>
  <rect x="48" y="136" width="150" height="78" rx="8" fill="#e7f0e8" stroke="#2f6b45"/>
  <text x="68" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">Route 53</text>
  <text x="68" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">shop.{env}</text>
  <rect x="230" y="136" width="170" height="78" rx="8" fill="#e7f0e8" stroke="#2f6b45"/>
  <text x="250" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">CloudFront + WAF</text>
  <text x="250" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">UI cached, API TTL 0</text>
  <rect x="432" y="136" width="170" height="78" rx="8" fill="#e7f0e8" stroke="#2f6b45"/>
  <text x="456" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">ALB + WAF</text>
  <text x="456" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">two public subnets</text>
  <rect x="634" y="136" width="190" height="78" rx="8" fill="#e7f0e8" stroke="#2f6b45"/>
  <text x="658" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">API Gateway</text>
  <text x="658" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">Cognito JWT, VPC link</text>
  <rect x="856" y="136" width="180" height="78" rx="8" fill="#f3ead2" stroke="#8a6a2f"/>
  <text x="880" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">S3 images</text>
  <text x="880" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">private, replicated</text>
  <rect x="1060" y="136" width="170" height="78" rx="8" fill="#f3ead2" stroke="#8a6a2f"/>
  <text x="1084" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">ECR + GitOps</text>
  <text x="1084" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">Argo CD syncs</text>

  <rect x="24" y="260" width="760" height="300" rx="12" fill="#fff" stroke="#1f2a24"/>
  <text x="40" y="286" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2a24">us-east-1  ·  EKS in private subnets, two AZs</text>
  <rect x="48" y="306" width="220" height="100" rx="8" fill="#e7eef8" stroke="#2c4c7c"/>
  <text x="64" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">AZ a  node group</text>
  <text x="64" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">stateless Deployments</text>
  <text x="64" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">HPA, min 2 nodes</text>
  <rect x="292" y="306" width="220" height="100" rx="8" fill="#e7eef8" stroke="#2c4c7c"/>
  <text x="308" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">AZ b  node group</text>
  <text x="308" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">same services</text>
  <text x="308" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">PDB and spread</text>
  <rect x="536" y="306" width="220" height="100" rx="8" fill="#f8e7e7" stroke="#8a3b3b"/>
  <text x="552" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">Secrets</text>
  <text x="552" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">Lambda writes them</text>
  <text x="552" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">External Secrets mounts</text>
  <rect x="48" y="424" width="220" height="110" rx="8" fill="#efe7f6" stroke="#5c3d78"/>
  <text x="64" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">Aurora Multi-AZ</text>
  <text x="64" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">writer + reader</text>
  <text x="64" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">RDS Proxy, TLS</text>
  <rect x="292" y="424" width="220" height="110" rx="8" fill="#efe7f6" stroke="#5c3d78"/>
  <text x="308" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">ElastiCache Redis</text>
  <text x="308" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">IAM auth, no password</text>
  <text x="308" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">Multi-AZ replica</text>
  <rect x="536" y="424" width="220" height="110" rx="8" fill="#efe7f6" stroke="#5c3d78"/>
  <text x="552" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a24">MSK Avro</text>
  <text x="552" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">IAM auth, port 9098</text>
  <text x="552" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4d5b53">Glue Avro, no password</text>

  <rect x="804" y="260" width="452" height="300" rx="12" fill="#fff" stroke="#1f2a24"/>
  <text x="820" y="286" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2a24">Accounts and failure</text>
  <text x="820" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">Non-prod: dev, qa, uat share one VPC and one Aurora.</text>
  <text x="820" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">Each has its own EKS, Redis, MSK, and Cognito.</text>
  <text x="820" y="376" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">Prod account: pre-prod and prod are separate VPCs.</text>
  <text x="820" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">Each Aurora cluster is a Global Database.</text>
  <text x="820" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">us-west-1 holds the secondary database, the network,</text>
  <text x="820" y="454" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">and replicas of images. EKS is built at failover.</text>
  <text x="820" y="488" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">One AZ loss: ALB, nodes, and Aurora fail over.</text>
  <text x="820" y="510" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2a24">Region loss: promote the west cluster, then apply.</text>

  <text x="36" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4d5b53">Apply order: network, ECR, EKS, data services, Aurora, then add-ons. Pre-prod and prod add the west network, MSK, and Aurora secondary.</text>
  <text x="36" y="634" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4d5b53">Source drawing: docs/architecture.excalidraw. This picture is that diagram, saved so the README can show it.</text>
  <text x="36" y="700" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a6a2f">ShopSphere  ·  us-east-1 primary  ·  us-west-1 pilot light</text>
</svg>
